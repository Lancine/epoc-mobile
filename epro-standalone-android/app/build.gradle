plugins {
    id 'com.android.application'
}

android {
    namespace 'ci.epro.geniia.technopedagogie.niveau1'
    compileSdk 35

    defaultConfig {
        applicationId 'ci.epro.geniia.technopedagogie.niveau1'
        minSdk 23
        targetSdk 35
        versionCode 210
        versionName '2.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}
