plugins {
    id 'com.android.application'
}

android {
    namespace 'ci.epro.geniia.technopedagogie.niveau1'
    compileSdk 35

    defaultConfig {
        // Conserve l’identifiant de la version 2.1.0 défectueuse afin que l’APK 2.2.1 puisse la mettre à jour.
        applicationId 'ci.epro.technopedagogie.niveau1'
        minSdk 23
        targetSdk 35
        versionCode 20201
        versionName '2.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}
