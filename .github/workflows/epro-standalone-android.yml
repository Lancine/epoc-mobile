name: Build EPro Android wrapper

on:
  push:
    branches:
      - epro-android-wrapper-v2.1.0
    paths:
      - 'epro-standalone-android/**'
      - '.github/workflows/epro-standalone-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build unsigned release wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle -p epro-standalone-android clean :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare portable build tools
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/epro-wrapper-artifact"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          mkdir -p "$OUT/tools/lib" "$OUT/tools/lib64"
          cp epro-standalone-android/app/build/outputs/apk/release/app-release-unsigned.apk "$OUT/epro-wrapper-unsigned.apk"
          cp "$BT/apksigner" "$OUT/tools/apksigner"
          cp "$BT/zipalign" "$OUT/tools/zipalign"
          cp "$BT/lib/apksigner.jar" "$OUT/tools/lib/apksigner.jar"
          cp "$BT/aapt2" "$OUT/tools/aapt2"
          cp "$BT/lib64/libc++.so" "$OUT/tools/lib64/libc++.so"
          chmod +x "$OUT/tools/apksigner" "$OUT/tools/zipalign" "$OUT/tools/aapt2"
          printf '35.0.0\n' > "$OUT/build-tools-version.txt"
          sha256sum "$OUT/epro-wrapper-unsigned.apk" > "$OUT/epro-wrapper-unsigned.apk.sha256"

      - name: Upload wrapper and build tools
        uses: actions/upload-artifact@v4
        with:
          name: epro-android-wrapper-v2.1.0
          path: epro-wrapper-artifact
          retention-days: 30
          if-no-files-found: error
